<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Activador de Cupones - ML</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Proxima Nova', -apple-system, 'Helvetica Neue', Helvetica, Roboto, Arial, sans-serif;
    }

    body {
      width: 340px;
      background: #f5f5f5;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    .header {
      background: #FFE600;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #e0cc00;
    }

    .logo-img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .header-text h1 {
      font-size: 13px;
      font-weight: 700;
      color: #1c1c1c;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 11px;
      color: #555;
      font-weight: 400;
    }

    /* ── Content ──────────────────────────────────────────────────── */
    .content {
      padding: 24px 20px 20px;
      text-align: center;
    }

    .coupon-icon {
      background: white;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
    }

    .coupon-img {
      width: 32px;
      height: auto;
    }

    .tagline {
      font-size: 15px;
      font-weight: 600;
      color: #1c1c1c;
      margin-bottom: 20px;
      line-height: 1.35;
    }

    /* ── Botón principal ──────────────────────────────────────────── */
    #toggleBtn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
      letter-spacing: 0.2px;
    }

    #toggleBtn:active {
      transform: scale(0.98);
    }

    #toggleBtn:hover {
      opacity: 0.88;
    }

    .off {
      background: #3483FA;
      color: #fff;
    }

    .on {
      background: #e53935;
      color: #fff;
    }

    /* ── Estado / Progreso ────────────────────────────────────────── */
    .status-msg {
      margin-top: 14px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      min-height: 36px;
      line-height: 1.4;
      transition: all 0.3s ease;
    }

    .status-msg:empty {
      display: none;
    }

    .status-msg.running {
      background: #e8f4fd;
      color: #1565c0;
      border: 1px solid #bbdefb;
    }

    .status-msg.done {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .status-msg.error {
      background: #fff3e0;
      color: #e65100;
      border: 1px solid #ffe0b2;
    }

    .status-msg.info {
      background: #f3e5f5;
      color: #6a1b9a;
      border: 1px solid #e1bee7;
    }

    /* ── Footer ───────────────────────────────────────────────────── */
    .footer {
      padding: 10px 16px;
      font-size: 11px;
      color: #999;
      background: white;
      border-top: 1px solid #eee;
      text-align: center;
    }

    .footer a {
      color: #3483FA;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      color: #1c1c1c;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="icon.png" alt="Logo" class="logo-img">
    <div class="header-text">
      <h1>Activador de Cupones</h1>
      <p>Mercado Libre Argentina</p>
    </div>
  </div>

  <div class="content">
    <div class="coupon-icon">
      <img src="cupon.png" alt="Cupón" class="coupon-img">
    </div>
    <p class="tagline">¡Aplicá todos tus cupones<br>con un solo clic!</p>
    <button id="toggleBtn" class="off">Cargando...</button>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="footer">
    Creado por <a href="https://www.desarrollados.com.ar" target="_blank">Desarrollados</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
